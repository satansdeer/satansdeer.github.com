name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Cloudflare deploy secrets
        id: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare Pages deploy skipped because CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN are not both configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          COMMIT_MESSAGE="$(git log -1 --pretty=%B | head -n 1)"
          npx wrangler pages deploy out \
            --project-name maksimivanov-com \
            --branch master \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$COMMIT_MESSAGE" \
            --commit-dirty=false
