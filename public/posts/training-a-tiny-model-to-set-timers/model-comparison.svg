<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Accuracy versus checkpoint size for timer models</title>
  <desc id="desc">Scatter plot. Flan-T5-small reached 100 percent exact match at 296 MB. T5-Efficient-tiny reached 99.1 percent at 62 MB and then 100 percent after label-copy repair.</desc>
  <rect width="1100" height="600" fill="#ffffff"/>

  <text x="70" y="60" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Accuracy vs Checkpoint Size</text>

  <rect x="150" y="110" width="820" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g stroke-width="1">
    <line x1="150" y1="398" x2="970" y2="398" stroke="#e2e8f0"/>
    <line x1="150" y1="326" x2="970" y2="326" stroke="#e2e8f0"/>
    <line x1="150" y1="254" x2="970" y2="254" stroke="#e2e8f0"/>
    <line x1="150" y1="182" x2="970" y2="182" stroke="#e2e8f0"/>
    <line x1="355" y1="110" x2="355" y2="470" stroke="#e2e8f0"/>
    <line x1="560" y1="110" x2="560" y2="470" stroke="#e2e8f0"/>
    <line x1="765" y1="110" x2="765" y2="470" stroke="#e2e8f0"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748b">
    <line x1="150" y1="470" x2="970" y2="470" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="150" y1="110" x2="150" y2="470" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="150" y="497" text-anchor="middle">0 MB</text>
    <text x="355" y="497" text-anchor="middle">75</text>
    <text x="560" y="497" text-anchor="middle">150</text>
    <text x="765" y="497" text-anchor="middle">225</text>
    <text x="970" y="497" text-anchor="middle">300</text>
    <text x="560" y="536" text-anchor="middle" font-size="15" fill="#334155">checkpoint size</text>

    <text x="132" y="474" text-anchor="end">95%</text>
    <text x="132" y="402" text-anchor="end">96%</text>
    <text x="132" y="330" text-anchor="end">97%</text>
    <text x="132" y="258" text-anchor="end">98%</text>
    <text x="132" y="186" text-anchor="end">99%</text>
    <text x="132" y="114" text-anchor="end">100%</text>
    <text x="78" y="290" text-anchor="middle" font-size="15" fill="#334155" transform="rotate(-90 78 290)">strict exact</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <path d="M302 175 C300 150 300 128 319 110" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 7"/>
    <circle cx="319" cy="175" r="15" fill="#059669"/>
    <circle cx="319" cy="110" r="15" fill="#16a34a"/>
    <circle cx="959" cy="110" r="15" fill="#2563eb"/>

    <text x="340" y="181" font-size="15" font-weight="700" fill="#047857">Tiny</text>
    <text x="340" y="203" font-size="13" fill="#047857">62 MB / 99.1%</text>

    <text x="340" y="104" font-size="15" font-weight="700" fill="#15803d">Tiny repaired</text>
    <text x="340" y="84" font-size="13" fill="#15803d">62 MB / 100%</text>

    <text x="760" y="104" font-size="15" font-weight="700" fill="#1d4ed8">Flan-T5-small</text>
    <text x="760" y="84" font-size="13" fill="#1d4ed8">296 MB / 100%</text>
  </g>
</svg>
